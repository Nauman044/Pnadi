<!DOCTYPE html>
<html lang="ur-Latn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Pandii 🐼</title>
<style>
:root{--bg1:#ffe3ee;--bg2:#e8dcff;--card:#ffffffcc;--ink:#5a2a47;--accent:#ff5c9d;--soft:#ffb3d1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1325;--bg2:#1d1840;--card:#3a2142cc;--ink:#ffe3f0;--accent:#ff7db3;--soft:#8a3d63}}
:root[data-theme="dark"]{--bg1:#2a1325;--bg2:#1d1840;--card:#3a2142cc;--ink:#ffe3f0;--accent:#ff7db3;--soft:#8a3d63}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
.card{position:relative;z-index:2;width:min(92vw,420px);background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:28px 22px;box-shadow:0 12px 40px #ff5c9d33}
.panda{font-size:84px;animation:bob 2s ease-in-out infinite;display:block}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
h1{font-size:28px;margin:6px 0 4px}
p{line-height:1.6;margin:8px 0}
.hint{opacity:.8;font-size:15px}
button{margin-top:14px;border:0;background:var(--accent);color:#fff;font-size:18px;padding:14px 28px;border-radius:999px;cursor:pointer;box-shadow:0 6px 0 #d63d7b;transition:transform .1s}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #d63d7b}
.gift{font-size:96px;cursor:pointer;animation:wob 1.2s infinite;display:inline-block}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.hidden{display:none}
.msg{animation:pop .6s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.wish{background:var(--soft);border-radius:18px;padding:12px 14px;margin:10px 0;font-size:16px}
.fl{position:fixed;bottom:-60px;font-size:28px;z-index:1;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:.9}}
.pic{width:170px;height:170px;border-radius:50%;object-fit:cover;object-position:50% 25%;border:5px solid var(--accent);box-shadow:0 8px 24px #ff5c9d55;animation:bob 2.4s ease-in-out infinite;display:block;margin:0 auto 6px}
.row{font-size:26px;letter-spacing:6px}
.snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:5;margin:0;padding:10px 14px;font-size:20px;box-shadow:0 3px 0 #d63d7b}
</style>
</head>

"🌸 Tumhari smile kabhi kam na ho, Pandii 🌸",
"🍰 Aaj cake bhi tumhara, treat bhi tumhari... pehle mujhe do! 😜",
"🐼 Tum jaisi cute aur pyari dost har kisi ko nahi milti 💕",

];
var i=0,icons=["🎈","🎀","💖","🌸","⭐","🐼","🎉","💗"];
function fly(n){
  for(var k=0;k<n;k++){
    var d=document.createElement("div");
    d.className="fl";
    d.textContent=icons[Math.floor(Math.random()*icons.length)];
    d.style.left=Math.random()*95+"vw";
    d.style.fontSize=(22+Math.random()*26)+"px";
    d.style.animationDuration=(4+Math.random()*4)+"s";
    document.body.appendChild(d);
    (function(x){setTimeout(function(){x.remove()},8500)})(d);
  }
}
document.getElementById("gift").onclick=function(){
  document.getElementById("s1").classList.add("hidden");
  document.getElementById("s2").classList.remove("hidden");
  fly(35);
  startMusic();
};
document.getElementById("next").onclick=function(){
  i=(i+1)%wishes.length;
  document.getElementById("wish").textContent=wishes[i];
  document.getElementById("pic2").src=photos[i%photos.length];
  fly(18);
};
</script>
